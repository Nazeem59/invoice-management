
# ==========================================
# APPLICATION CONFIGURATION
# ==========================================

spring.application.name=invoice-management
server.port=8080


# ==========================================
# DATABASE CONFIGURATION
# ==========================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/invoice_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jakarta}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# JPA CONFIGURATION
# ==========================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# LOGGING
# ==========================================

logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:DEBUG}


# ==========================================
# JWT CONFIGURATION
# ==========================================

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
